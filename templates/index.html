<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MTH Gate – ระบบเปิดไม้กั้น</title>
  
  <!-- Automatic Day/Night Theme Preloader (No Flash) -->
  <script>
    (function() {
      var manual = localStorage.getItem('mth_theme_manual');
      var hour = new Date().getHours();
      var autoTheme = (hour >= 6 && hour < 18) ? 'light' : 'dark';
      var theme = manual || autoTheme;
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  
  <!-- Modern Fonts: Prompt (TH) & Plus Jakarta Sans (EN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/static/css/mobile.css" />
  <link rel="icon" type="image/png" href="/static/LOGO_MTH_TOP.png" />
  <meta name="theme-color" content="#0a0e17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>

  <!-- App Wrapper (Fit 100dvh) -->
  <div class="app-layout">

    <!-- ══════ TOP HEADER ══════ -->
    <header class="app-header">
      <div class="brand-box">
        <img src="/static/LOGO_MTH_TOP.png" alt="MTH Logo" class="brand-logo" />
        <div class="brand-text">
          <div class="brand-title">MTH GATE</div>
          <div class="brand-subtitle">ACCESS SYSTEM</div>
        </div>
      </div>

      <div class="header-right">
        <!-- Online/Offline Status Pill -->
        <div class="status-pill" id="statusIndicator">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-label" id="statusText">เชื่อมต่อ</span>
        </div>

        <!-- Dark/Light Mode Switcher -->
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="สลับโหมดมืด/สว่าง">
          <svg class="theme-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- ══════ MAIN VIEWPORT CONTENT ══════ -->
    <main class="app-main">

      <!-- ──────────────────────────────────────────
           SCREEN 1: PIN AUTHENTICATION
      ─────────────────────────────────────────── -->
      <section id="screen-login" class="view-screen" style="display: none;">
        <div class="login-wrapper">
          <div class="logo-hero">
            <img src="/static/LOGO_MTH_TOP.png" alt="MTH" class="hero-logo" />
          </div>

          <h2 class="auth-heading">กรุณากรอกรหัส 6 PIN</h2>

          <!-- PIN indicator dots (6 digits) -->
          <div class="pin-display" id="pinDots">
            <span class="pin-digit"></span>
            <span class="pin-digit"></span>
            <span class="pin-digit"></span>
            <span class="pin-digit"></span>
            <span class="pin-digit"></span>
            <span class="pin-digit"></span>
          </div>

          <div id="pinError" class="auth-message"></div>

          <!-- Glass Keypad -->
          <div class="glass-keypad">
            <button class="num-key" onclick="pressKey('1')">1</button>
            <button class="num-key" onclick="pressKey('2')">2</button>
            <button class="num-key" onclick="pressKey('3')">3</button>
            <button class="num-key" onclick="pressKey('4')">4</button>
            <button class="num-key" onclick="pressKey('5')">5</button>
            <button class="num-key" onclick="pressKey('6')">6</button>
            <button class="num-key" onclick="pressKey('7')">7</button>
            <button class="num-key" onclick="pressKey('8')">8</button>
            <button class="num-key" onclick="pressKey('9')">9</button>
            <button class="num-key fn-key" onclick="clearPin()">C</button>
            <button class="num-key" onclick="pressKey('0')">0</button>
            <button class="num-key fn-key" onclick="deletePin()">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                <line x1="18" y1="9" x2="12" y2="15"></line>
                <line x1="12" y1="9" x2="18" y2="15"></line>
              </svg>
            </button>
          </div>
        </div>
      </section>

      <!-- ──────────────────────────────────────────
           SCREEN 2: AUTHORIZED GATE OPENER
      ─────────────────────────────────────────── -->
      <section id="screen-gate" class="view-screen" style="display: none;">
        
        <!-- User Badge Pill -->
        <div class="user-chip">
          <div class="chip-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div class="chip-info">
            <span class="chip-name" id="userName">เจ้าหน้าที่</span>
            <span class="chip-status">ได้รับอนุมัติสิทธิ์</span>
          </div>
          <button class="chip-logout" onclick="openLogoutModal()" title="ออกจากระบบ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>

        <!-- Safe Toast Slot (ตำแหน่งแจ้งเตือนที่ไม่บัง header หรือชื่อเจ้าหน้าที่) -->
        <div id="toastSlot" class="toast-slot"></div>

        <!-- Center Stage: Giant Luxury Power Button -->
        <div class="gate-hero-stage">
          
          <!-- Outer Pulsing Rings -->
          <div class="aura-ring ring-1"></div>
          <div class="aura-ring ring-2"></div>

          <!-- The Power Button (No text, pure iconic power symbol) -->
          <button class="btn-luxury-gate btn-power-gate" id="btnGateOpen" onclick="doOpenGate()" aria-label="เปิดไม้กั้น">
            <div class="power-icon-wrap" id="powerIconWrap">
              <svg class="power-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Outer Arc Circle -->
                <path class="power-arc" d="M31.7 20.8A40 40 0 1 0 68.3 20.8" stroke="currentColor" stroke-width="8.5" stroke-linecap="round" />
                <!-- Vertical Center Line -->
                <path class="power-line" d="M50 10V46" stroke="currentColor" stroke-width="8.5" stroke-linecap="round" />
              </svg>
            </div>
          </button>

        </div>

        <!-- Current Status Hint -->
        <div class="gate-status-hint">
          <span class="hint-pulse"></span>
          <span id="gateActionHint">แตะปุ่มเพื่อส่งสัญญาณเปิดไม้กั้น</span>
        </div>

      </section>

    </main>

    <!-- ══════ BOTTOM FOOTER CREDIT ══════ -->
    <footer class="app-footer">
      <span class="footer-text">Dev by ISSARAPONG SUYA, 2026</span>
    </footer>

  </div>

  <!-- ══════ LOGOUT CONFIRMATION MODAL ══════ -->
  <div id="logoutModal" class="custom-modal-backdrop" style="display: none;" onclick="closeLogoutModal(event)">
    <div class="custom-modal-card">
      <div class="modal-icon-badge danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </div>
      <h3 class="modal-title">ยืนยันการออกจากระบบ</h3>
      <p class="modal-description">คุณต้องการออกจากระบบบนอุปกรณ์นี้หรือไม่? หากออกแล้วจะต้องกรอกรหัส PIN หรือสแกนลิงก์ใหม่อีกครั้ง</p>
      <div class="modal-btn-row">
        <button class="btn-modal-cancel" onclick="closeLogoutModal()">ยกเลิก</button>
        <button class="btn-modal-confirm" onclick="confirmLogout()">ออกจากระบบ</button>
      </div>
    </div>
  </div>

  <script>
    window.SERVER_USER = {{ user|tojson if user else 'null' }};
  </script>
  <script src="/static/js/mobile.js"></script>
</body>
</html>
